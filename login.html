<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
  <header class="site-header">
    <div class="container">
      <h1>Company Financial Behavior Analysis & Advisory System</h1>
      <p>Login Page</p>
    </div>
  </header>

  <nav class="site-nav">
    <div class="container nav-row">
      <a href="index.html">Home</a>
      <a href="login.html" class="active">Login</a>
      <a href="register.html">Register</a>
      <a href="listing.html">Transaction Listing</a>
      <a href="add-transaction.html">Add Transaction</a>
      <a href="dashboard.html">Dashboard</a>
      <span id="auth-status" class="auth-status"></span>
    </div>
  </nav>

  <main class="container page-section">
    <section class="simple-card">
      <h2>User Login</h2>
      <p class="info-text">Demo account: demo@system.com / 123456</p>
      <form id="login-form" class="form-grid">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" placeholder="user@email.com" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" placeholder="Enter password" required>
        </div>
        <div class="full-width">
          <button class="submit-btn" type="submit">Login</button>
        </div>
      </form>
      <p id="login-message" class="info-text"></p>
    </section>
  </main>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
